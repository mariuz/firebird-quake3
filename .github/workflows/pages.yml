name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The demo's pak0.pk3 sits inside the Linux installer (a shell script with a gzipped tar appended)
      - name: Cache the demo pak
        id: pak
        uses: actions/cache@v4
        with:
          path: public/pak/pak0.pk3
          key: q3ademo-1.11-6-${{ hashFiles('scripts/fetch-pak.mjs') }}

      - name: Fetch the demo pak
        if: steps.pak.outputs.cache-hit != 'true'
        run: npm run fetch-pak

      # OpenArena 0.8.8 and its Community Map-Pack (GPLv2 game data, 440 MB, downloaded once): each of their
      # deathmatch arenas becomes a small pk3 of what it uses, public/pak/maps/*.pk3, fetched by the page
      # when it is picked
      - name: Cache OpenArena and the Community Map-Pack
        uses: actions/cache@v4
        with:
          path: .cache/maps/
          key: openarena-0.8.8-oacmp-volume1-v3

      - name: Build the OpenArena map packs
        continue-on-error: true   # (a site without them is better than none when the mirror is down)
        run: npm run fetch-maps

      # Runs the game's SQL inside the real Firebird WASM engine under Node:
      # loads the arena, runs, jumps, shoots, rides a jump pad, renders frames.
      - name: SQL smoke test (q3dm1)
        run: npm test

      - name: SQL smoke test (q3dm17, the jump pads)
        run: node scripts/sql-smoke.mjs q3dm17

      # The player's movement side by side with Quake III's bg_pmove.c at 8 ms
      - name: The movement
        run: npm run test:pmove

      # The first-person view: the kicks, the dips, the lean and the bob (no engine needed)
      - name: The view
        run: npm run test:view

      # The bots: they see, chase, shoot, pick things up, die and respawn; the score keeps up
      - name: The bots
        run: npm run test:bots

      # The bots on q3dm17: they hunt over the waypoint graph and take the jump pads
      - name: The bots on the jump pads
        run: npm run test:bots:dm17

      - name: Team deathmatch
        run: npm run test:team

      - name: Tournament
        run: npm run test:tourney

      # Every hosted OpenArena and Community Map-Pack arena on top of the demo pak: its pictures, its spawns, a second of play
      - name: The OpenArena map packs
        run: npm run test:maps

      - name: Headless screenshots
        run: npm run screenshots

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
